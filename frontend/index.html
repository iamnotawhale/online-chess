<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      html { background: #fbfbfd; }
      html[data-theme='dark'] { background: #0a090c; }
      body {
        margin: 0;
        min-height: 100dvh;
        background: inherit;
        color: #131318;
        font-family: "Manrope", system-ui, sans-serif;
      }
      html[data-theme='dark'] body { color: #f1efeb; }
    </style>
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#475569" />
    <meta name="description" content="Play chess online: Player vs Player, Player vs Bot, and solve daily puzzles with ELO rating system" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OnChess" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Social/OG Tags -->
    <meta property="og:title" content="OnChess - Online Chess Game" />
    <meta property="og:description" content="Play chess online with friends or AI, solve puzzles, and climb the ELO ladder" />
    <meta property="og:image" content="/icons/favicon-512x512.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OnChess" />
    <meta name="twitter:description" content="Play chess online and solve daily puzzles" />
    <meta name="twitter:image" content="/icons/favicon-512x512.png" />
    
    <title>OnChess - Online Chess Game</title>
    <script>
      try {
        var t = localStorage.getItem('themeMode') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
