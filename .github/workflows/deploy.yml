name: Deploy to Odyssey

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Create .env from secret
        run: |
          printf '%s\n' "${{ secrets.ENV_FILE }}" > .env

      - name: Deploy to Odyssey
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          PORT: ${{ secrets.SERVER_PORT }}
        run: |
          PORT="${PORT:-2222}"
          scp -P "$PORT" -o StrictHostKeyChecking=no .env "${USER}@${HOST}:/opt/online-chess/.env"
          ssh -p "$PORT" -o StrictHostKeyChecking=no "${USER}@${HOST}" <<'EOF'
            set -e
            cd /opt/online-chess
            git fetch origin
            git checkout main
            git reset --hard origin/main
            chmod +x deploy-odyssey.sh scripts/*.sh db/apply-migrations.sh
            DEPLOY_FROM_CI=1 ./deploy-odyssey.sh
          EOF
